name: Job Agente Automation

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  run-bots:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del codice
      uses: actions/checkout@v4

    - name: Configurazione ambiente Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Installazione Librerie
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Fase 1 - Bot Esploratore (Ricerca Prospect)
      env:
        GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
      run: python cerca_aziende.py

    - name: Fase 2 - Bot IA (Classificazione Gemini)
      env:
        GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
      run: python main.py
